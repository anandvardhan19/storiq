name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: platform

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: platform

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
        working-directory: platform
        env:
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_NAME: Storiq
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: Assemble Pages deployment directory
        run: |
          mkdir -p .deploy
          cp -r .open-next/assets/. .deploy/
          cp .open-next/worker.js .deploy/_worker.js
          cp -r .open-next/.build .deploy/.build
          cp -r .open-next/cloudflare .deploy/cloudflare
          cp -r .open-next/middleware .deploy/middleware
          cp -r .open-next/server-functions .deploy/server-functions
        working-directory: platform

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .deploy --project-name storiq
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
